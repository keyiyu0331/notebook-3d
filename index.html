<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyi Yu · Lab Notebook</title>
<meta name="description" content="Keyi Yu: Healthcare AI. An interactive 3D lab notebook: LLM systems, RAG and multi-agent pipelines for clinical and biomedical data. M.S. Bioengineering at Stanford.">
<meta property="og:title" content="Keyi Yu | Lab Notebook (3D)">
<meta property="og:description" content="Flip through my lab notebook: LLM systems for clinical and biomedical data. Stanford M.S. '27.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:ital,wght@0,600;1,400;1,500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f1ebdc; --soft: rgba(241,235,220,.72); --faint: rgba(241,235,220,.5);
    --glass: rgba(20,16,12,.62); --line: rgba(241,235,220,.16); --accent: #e8b04a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0b09; color: var(--ink);
    font: 14px/1.4 "IBM Plex Mono", ui-monospace, monospace; -webkit-font-smoothing: antialiased; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }
  a { color: inherit; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .skip { position: fixed; left: 12px; top: -60px; z-index: 20; background: var(--ink); color: #111; padding: 8px 12px; border-radius: 6px; }
  .skip:focus { top: 12px; }

  /* top bar */
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; pointer-events: none; gap: 12px; }
  .top > * { pointer-events: auto; }
  .brand { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
  .brand b { color: var(--ink); font-weight: 600; }
  .top nav { display: flex; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line); color: var(--ink); text-decoration: none; font: inherit; font-size: 12px;
    cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .pill:hover { border-color: rgba(241,235,220,.4); }
  .pill.primary { background: var(--ink); color: #15110d; border-color: var(--ink); }

  /* bottom HUD */
  .hud { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: var(--glass);
    border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .4s, transform .4s; max-width: calc(100vw - 24px); }
  .hud.hidden { opacity: 0; transform: translate(-50%, 20px); pointer-events: none; }
  .hud button { font: inherit; color: var(--ink); background: transparent; border: 0; height: 36px; min-width: 36px;
    padding: 0 12px; border-radius: 999px; cursor: pointer; font-size: 13px; }
  .hud button:hover { background: rgba(241,235,220,.1); }
  .hud button:disabled { opacity: .3; cursor: default; background: transparent; }
  .hud .where { padding: 0 10px; min-width: 210px; text-align: center; font-size: 12px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud .where b { color: var(--ink); font-weight: 500; }
  .hud .sep { width: 1px; height: 20px; background: var(--line); }

  .hint { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); font: 600 30px/1.1 Caveat, cursive; color: var(--ink);
    text-shadow: 0 2px 12px rgba(0,0,0,.6); pointer-events: none; transition: opacity .6s; text-align: center; }
  .hint.hidden { opacity: 0; }

  .tip { position: fixed; z-index: 15; pointer-events: none; transform: translate(14px, -130%); padding: 6px 10px; border-radius: 6px;
    background: var(--ink); color: #15110d; font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .15s; }
  .tip.show { opacity: 1; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0e0b09; z-index: 30; transition: opacity .8s; }
  .loading.done { opacity: 0; pointer-events: none; }
  .loading span { font: 600 34px Caveat, cursive; color: var(--soft); }

  .nogl { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; z-index: 40; background: #0e0b09; }
  .nogl.show { display: grid; }

  @media (max-width: 640px) {
    .brand { display: none; }
    .hud .where { min-width: 0; flex: 1; }
    .hud .opt { display: none; }
  }
</style>
</head>
<body>
<a class="skip" href="https://keyiyu0331.github.io/">Skip to the text version of this site</a>
<canvas id="gl" tabindex="0" aria-label="Interactive 3D lab notebook. Use left and right arrow keys to turn pages."></canvas>
<div class="vignette"></div>

<header class="top">
  <div class="brand"><b>Keyi Yu</b> · lab notebook · healthcare AI</div>
  <nav>
    <a class="pill" href="https://keyiyu0331.github.io/" title="Plain 2D version">2D version</a>
    <a class="pill primary" id="resumeBtn" target="_blank" rel="noopener">↓ resume</a>
  </nav>
</header>

<div class="hint" id="hint">click the notebook to open it</div>

<div class="hud hidden" id="hud" role="toolbar" aria-label="Notebook controls">
  <button id="prev" aria-label="Previous page">←</button>
  <div class="where" id="where" aria-live="polite"></div>
  <button id="next" aria-label="Next page">→</button>
  <span class="sep opt"></span>
  <button id="zoom" class="opt" aria-pressed="false" title="Zoom in to read (Z)">read</button>
  <button id="close" class="opt" title="Close the notebook">close</button>
</div>

<div class="tip" id="tip" role="tooltip"></div>
<div class="loading" id="loading"><span>opening the notebook…</span></div>
<div class="nogl" id="nogl"><div>
  <p style="font:600 36px Caveat,cursive">This 3D notebook needs WebGL.</p>
  <p><a class="pill primary" href="https://keyiyu0331.github.io/">Read the 2D version →</a></p>
</div></div>

<main id="a11y" class="sr-only"></main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
